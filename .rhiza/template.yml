# Rhiza template configuration
# https://github.com/Jebel-Quant/rhiza

template:
  repository: Jebel-Quant/rhiza
  ref: main

# Project type and language configuration
project:
  type: python
  name: skunklabs-mvp-v0

# Selected profiles for this project
profiles:
  - python-pytest      # pytest with coverage
  - python-ruff        # linting and formatting
  - pre-commit         # pre-commit hooks
  - github-actions     # CI/CD workflows

# Testing configuration
testing:
  framework: pytest
  coverage: true
  benchmark: false

# Additional settings
settings:
  python_version: "3.11"
  line_length: 96
