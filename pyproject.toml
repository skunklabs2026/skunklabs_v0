[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skunklabs-mvp-v0"
version = "0.1.0"
description = "Local detection, tracking and operator engagement demo. Actuation is simulated."
requires-python = ">=3.11"
readme = "README.md"

# This table and uv.lock are the only declaration of the Python environment.
# Direct dependencies are pinned here; uv.lock pins everything underneath them.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "opencv-python==4.10.0.84",
    "numpy==2.1.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# Neural detector. Pulls in torch (~2 GB), one-time download.
#
# The upper bound is not cosmetic: ultralytics constrains numpy on macOS, and
# 8.4.123 is the newest release whose constraint admits the numpy pinned
# above. 8.3.55 required numpy<2.0.0 on darwin, so this extra could not be
# installed on a Mac at all — `uv lock` refuses to resolve it.
yolo = ["ultralytics==8.4.123"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    # Must match the rev in .pre-commit-config.yaml and is what `make lint`
    # runs. 0.9.2 cannot even parse this file's [tool.ruff] table — RUF059
    # did not exist yet — so the pin and the config had silently diverged
    # while `uvx ruff` quietly used whatever was newest.
    "ruff==0.16.7",
    "pre-commit==4.0.1",
    # Invoked, not imported — `make marimo` opens backend/notebooks/. Pinned
    # like everything else so a notebook that works here works in review.
    "marimo==0.24.2",
    # Quality gates. Also invoked rather than imported: `make typecheck` and
    # `make security`. Locked so CI and a laptop run the same versions — a
    # linter that floats turns an unchanged repo red.
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
# Offline dataset analysis (repo-root notebooks/). Not needed to run the demo —
# the core dependency list above stays at seven packages on purpose. marimo is
# not repeated here: it is already a dev pin, and `make setup-research` syncs
# both extras, so a second pin could only ever disagree with the first.
research = [
    "pandas==2.2.3",
    # Already in the lock via ultralytics; pinning it lower here would drag the
    # yolo extra down with it.
    "matplotlib==3.11.2",
    # 5.2.2 is the fix for PYSEC-2026-2158; `make security` fails on 5.2.0.
    "gdown==5.2.2",
]

[project.scripts]
skunklabs = "backend.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

# ---------------------------------------------------------------------------
# Transitive-dependency floors
#
# Constraints, not dependencies: these packages are pulled in by something
# else and are never imported here. Each entry is a floor raised past a known
# advisory that the direct pin could not reach on its own. `make security`
# (pip-audit) is what tells you when one is needed — and when one can go.
# ---------------------------------------------------------------------------

[tool.uv]
constraint-dependencies = [
    # via marimo. PYSEC-2026-3609, PYSEC-2026-3654.
    "pymdown-extensions>=11.0.1",
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# `backend` is in testpaths for its doctests only — the suite itself lives in
# `tests/`. Docstring examples that are run on every `make test` cannot drift
# away from the code they describe.
testpaths = ["tests", "backend"]
addopts = "-q --strict-markers --doctest-modules"
filterwarnings = [
    # Starlette's TestClient reaches through a deprecated anyio alias. Not
    # ours to fix, and it would otherwise be the only noise in a clean run.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/__pycache__/*"]
# Branch coverage is the informative number in a codebase this full of
# state-machine and detector conditionals: statement coverage counts an `if`
# as covered the moment either side of it runs.
branch = true

[tool.coverage.report]
# 90% branch coverage, against a measured 93.08%. The frontend is held to the
# same number in frontend/vite.config.ts, so "90% coverage" means one thing
# across this repo rather than two. Raise it as coverage rises; never lower it
# to make a red build green — a change that drops coverage owes a test.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Security scanning — `make security`
# ---------------------------------------------------------------------------

[tool.bandit]
# `tests/` is excluded rather than skipped rule-by-rule: B101 fires on every
# assert, and asserting is what a test is for. Scanning it would bury the
# backend's findings under ~250 of them. `scripts/` is scanned.
exclude_dirs = ["tests", ".venv", "frontend", "node_modules"]

# ---------------------------------------------------------------------------
# Type checking
#
# Deliberately permissive to start with, and tightened over time: the point of
# turning it on was to gate the contract in schemas.py, not to spend a week
# annotating the OpenCV boundary. Every `disallow_*` left at its default is a
# rung still to climb, not an oversight.
# ---------------------------------------------------------------------------

[tool.mypy]
# `backend` only for now. `scripts/` currently trips three false positives in
# the opencv and numpy stubs (cv2.VideoWriter_fourcc is undeclared; numpy's
# in-place operators reject a union dtype) — real stub gaps, not real bugs.
# Adding it is the next rung.
files = ["backend"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# schemas.py is the canonical API contract and frontend/src/types.ts is
# generated from it, so the plugin earns its place immediately.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither ships type information. torch and ultralytics are behind the
# optional `.[yolo]` extra and are not installed in CI at all.
module = ["torch.*", "ultralytics.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Lint / format — one tool, so "is this formatted right?" is never a debate
# in review.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = [".venv", "assets", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import ordering
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    # FastAPI's dependency injection is expressed as call-in-default
    # (`File(...)`, `Depends(...)`). Not a mutable-default bug.
    "B008",
    # Optional hooks on abstract base classes (`Detector.reset`, `close`) are
    # intentionally no-ops: a detector implements them only if it has state.
    "B027",
    # The UI copy uses en dashes throughout, in strings the operator reads.
    "RUF001",
    # `zip(xs[:-1], xs[1:])` reads more plainly than `itertools.pairwise` in
    # the geometry code, and the slices are equal-length by construction.
    "RUF007",
    "B905",
    # Unused unpacked variables are intentional in tuple unpacking patterns.
    "RUF059",
    # Unnecessary int() calls in round() are kept for explicit type clarity.
    "RUF046",
    # str+Enum pattern is used for JSON serialization compatibility.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on values that read better inline than extracted, and use
# broad `pytest.raises` where the point is that *something* rejects the input.
"tests/*" = ["E501", "B017"]
