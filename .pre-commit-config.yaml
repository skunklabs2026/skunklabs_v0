repos:
  # Python linting and formatting. notebooks/ is excluded on purpose: marimo
  # owns those files' formatting, and `make lint` covers backend tests scripts.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  # TypeScript/JavaScript linting and formatting
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: typecheck
        name: typecheck
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # Run tests
  - repo: local
    hooks:
      - id: test-backend
        name: test-backend
        entry: bash -c '.venv/bin/pytest -q'
        language: system
        files: ^(backend|tests)/.*\.py$
        pass_filenames: false

      - id: test-frontend
        name: test-frontend
        entry: bash -c 'cd frontend && npm run test'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
