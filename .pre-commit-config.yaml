# Local convenience, not a gate. CI is the gate, and every CI job invokes a
# `make` target (see .github/workflows/ci.yml) — these hooks call the same
# targets so a hook and CI cannot disagree about what a check means.
#
# Note the ruff hooks run with --fix while `make lint` runs --check: that is
# deliberate here (fix on commit, verify in CI), but it does mean a passing
# commit is not proof CI will pass. Run `make check` before opening a PR.
repos:
  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # keep in step with the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # TypeScript/JavaScript linting and formatting
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: make lint-frontend
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: typecheck-frontend
        name: typecheck-frontend
        entry: make typecheck-frontend
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: typecheck-backend
        name: typecheck-backend
        entry: make typecheck-backend
        language: system
        files: ^(backend)/.*\.py$
        pass_filenames: false

  # Tests
  - repo: local
    hooks:
      - id: test-backend
        name: test-backend
        entry: make test-backend
        language: system
        files: ^(backend|tests)/.*\.py$
        pass_filenames: false

      - id: test-frontend
        name: test-frontend
        entry: make test-frontend
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
